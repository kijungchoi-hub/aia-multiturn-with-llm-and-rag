openapi: 3.1.0
info:
  title: Multiturn Chatflow RAG Assistant API
  version: 0.2.0
  description: |
    Dify Chatflow-centered multiturn orchestration API.
    Azure AI Search hybrid retrieval and Workflow subflow boundaries are reflected.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:8080
    description: Local

tags:
  - name: Chat
  - name: Supervisor
  - name: Search
  - name: Judge
  - name: Answer
  - name: Memory
  - name: Policy
  - name: Workflow

paths:
  /chat:
    post:
      tags: [Chat]
      summary: End-to-end multiturn chat orchestration on Dify Chatflow
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Chat response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /supervisor/route:
    post:
      tags: [Supervisor]
      summary: Decide route and rewrite query from multiturn context
      operationId: supervisorRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupervisorRouteRequest'
      responses:
        '200':
          description: Route decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorRouteResponse'

  /search/hybrid:
    post:
      tags: [Search]
      summary: Azure AI Search hybrid retrieval with optional semantic ranker
      operationId: hybridSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HybridSearchRequest'
      responses:
        '200':
          description: Hybrid search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HybridSearchResponse'

  /judge/evidence:
    post:
      tags: [Judge]
      summary: Judge whether current evidence is sufficient for answering
      operationId: judgeEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceJudgeRequest'
      responses:
        '200':
          description: Sufficiency result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceJudgeResponse'

  /workflow/dispatch:
    post:
      tags: [Workflow]
      summary: Dispatch stateless Dify Workflow subflow for API or async jobs
      operationId: workflowDispatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDispatchRequest'
      responses:
        '200':
          description: Workflow execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDispatchResponse'

  /answer:
    post:
      tags: [Answer]
      summary: Generate grounded answer from route, evidence, workflow result, and context
      operationId: answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '200':
          description: Generated answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /memory/upsert:
    post:
      tags: [Memory]
      summary: Upsert session memory and long-term memory candidates
      operationId: upsertMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryUpsertRequest'
      responses:
        '200':
          description: Upsert result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryUpsertResponse'

  /policy/check:
    post:
      tags: [Policy]
      summary: Validate input or output against safety and privacy policy
      operationId: policyCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCheckRequest'
      responses:
        '200':
          description: Policy decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyCheckResponse'

components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Blocked by policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ChatRequest:
      type: object
      required: [conversation_id, user_id, message]
      properties:
        conversation_id:
          type: string
        user_id:
          type: string
        message:
          type: string
        locale:
          type: string
          default: ko-KR
        context:
          $ref: '#/components/schemas/SessionContext'
        profile:
          $ref: '#/components/schemas/UserProfile'
        options:
          $ref: '#/components/schemas/ChatOptions'

    ChatOptions:
      type: object
      properties:
        top_k:
          type: integer
          minimum: 1
          maximum: 50
          default: 8
        max_tokens:
          type: integer
          minimum: 128
          maximum: 8192
          default: 1200
        include_citations:
          type: boolean
          default: true
        enable_memory_write:
          type: boolean
          default: true
        max_search_retries:
          type: integer
          minimum: 0
          maximum: 2
          default: 2

    ChatResponse:
      type: object
      required: [route, answer, policy]
      properties:
        route:
          type: string
          enum: [answer_direct, search, clarify]
        answer:
          type: string
        clarifying_question:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        followups:
          type: array
          items:
            type: string
        policy:
          $ref: '#/components/schemas/PolicyDecision'
        debug:
          $ref: '#/components/schemas/DebugTrace'

    SupervisorRouteRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        context:
          $ref: '#/components/schemas/SessionContext'
        profile:
          $ref: '#/components/schemas/UserProfile'

    SupervisorRouteResponse:
      type: object
      required: [route]
      properties:
        route:
          type: string
          enum: [answer_direct, search, clarify]
        rewritten_query:
          type: string
        sub_questions:
          type: array
          items:
            type: string
        filters:
          $ref: '#/components/schemas/SearchFilter'
        clarifying_question:
          type: string
        use_workflow:
          type: boolean

    HybridSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        top_k:
          type: integer
          minimum: 1
          maximum: 50
          default: 8
        use_semantic_ranker:
          type: boolean
          default: true
        filters:
          $ref: '#/components/schemas/SearchFilter'

    HybridSearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'

    EvidenceJudgeRequest:
      type: object
      required: [question, evidence, retry_count]
      properties:
        question:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        retry_count:
          type: integer
          minimum: 0
          maximum: 2

    EvidenceJudgeResponse:
      type: object
      required: [verdict, retry_allowed]
      properties:
        verdict:
          type: string
          enum: [SUFFICIENT, INSUFFICIENT]
        missing:
          type: string
        suggested_rewrite:
          type: string
        retry_allowed:
          type: boolean

    WorkflowDispatchRequest:
      type: object
      required: [workflow_type, payload]
      properties:
        workflow_type:
          type: string
          enum: [fact_api, async_job, formatter]
        payload:
          type: object
          additionalProperties: true

    WorkflowDispatchResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, pending, failed]
        output:
          type: object
          additionalProperties: true

    AnswerRequest:
      type: object
      required: [route, question, context]
      properties:
        route:
          type: string
          enum: [answer_direct, search, clarify]
        question:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        workflow_result:
          type: object
          additionalProperties: true
        context:
          $ref: '#/components/schemas/SessionContext'
        profile:
          $ref: '#/components/schemas/UserProfile'

    AnswerResponse:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        confidence:
          type: number
        uncertainty:
          type: string

    MemoryUpsertRequest:
      type: object
      required: [user_id, conversation_id]
      properties:
        user_id:
          type: string
        conversation_id:
          type: string
        session_memory:
          type: array
          items:
            $ref: '#/components/schemas/MemoryItem'
        long_term_memory:
          type: array
          items:
            $ref: '#/components/schemas/MemoryItem'
        policy:
          $ref: '#/components/schemas/MemoryPolicy'

    MemoryUpsertResponse:
      type: object
      properties:
        saved:
          type: integer
        skipped:
          type: integer
        reason_codes:
          type: array
          items:
            type: string

    PolicyCheckRequest:
      type: object
      required: [phase, content]
      properties:
        phase:
          type: string
          enum: [input, output]
        content:
          type: string
        metadata:
          type: object
          additionalProperties: true

    PolicyCheckResponse:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/PolicyDecision'
        fixes:
          type: array
          items:
            type: string

    SessionContext:
      type: object
      properties:
        recent_turns:
          type: array
          items:
            $ref: '#/components/schemas/Turn'
        summary:
          type: string
        open_loops:
          type: array
          items:
            type: string

    Turn:
      type: object
      required: [role, text]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        text:
          type: string
        created_at:
          type: string
          format: date-time

    UserProfile:
      type: object
      properties:
        tone:
          type: string
          enum: [concise, balanced, detailed]
        preferred_format:
          type: string
          enum: [paragraph, bullet, table]
        language:
          type: string
          default: ko

    SearchFilter:
      type: object
      properties:
        product:
          type: string
        channel:
          type: string
        user_tier:
          type: string

    SearchResult:
      type: object
      required: [doc_id, title, content, score]
      properties:
        doc_id:
          type: string
        title:
          type: string
        content:
          type: string
        score:
          type: number
        reranker_score:
          type: number
        metadata:
          type: object
          additionalProperties: true

    Citation:
      type: object
      required: [doc_id]
      properties:
        doc_id:
          type: string
        title:
          type: string

    MemoryItem:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
        ttl_seconds:
          type: integer
          minimum: 1
        pii:
          type: boolean
          default: false
        confidence:
          type: number
          minimum: 0
          maximum: 1

    MemoryPolicy:
      type: object
      properties:
        allow_pii:
          type: boolean
          default: false
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.7

    PolicyDecision:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pass, warn, block]
        reason_codes:
          type: array
          items:
            type: string

    DebugTrace:
      type: object
      properties:
        trace_id:
          type: string
        route:
          type: string
        retrieval_used:
          type: boolean
        search_retry_count:
          type: integer
        workflow_used:
          type: boolean

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
