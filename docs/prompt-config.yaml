{
  "version": "1.1.0",
  "name": "multiturn-flow-prompts",
  "description": "Prompt config for Dify Chatflow-based multiturn response flow nodes",
  "global_system": "역할: 당신은 Dify Chatflow 안에서 동작하는 멀티턴 RAG 실행 모델이다. 목표: 대화 메모리를 유지하면서 Azure AI Search 하이브리드 검색 근거로 답변을 생성한다. 규칙: (1) JSON만 출력 (2) route는 answer_direct/search/clarify 중 하나 (3) 검색이 필요하면 Azure AI Search용 query/filters 생성 (4) Judge 부족 판정 시 최대 2회까지만 재작성 (5) Workflow는 메모리 없는 보조 서브플로로만 사용 (6) 불확실성 명시 (7) 정책 위반 가능 시 차단 또는 안전 대안 제시.",
  "nodes": [
    {
      "id": "B",
      "name": "input_parse",
      "system": "사용자 입력에서 의도, 엔티티, 누락 슬롯, 최신성 요구를 추출하라.",
      "user_template": "message: {{user_message}}\nrecent_turns: {{recent_turns}}\nconversation_summary: {{conversation_summary}}",
      "output_schema": {
        "intent": "string",
        "entities": ["string"],
        "required_slots": ["string"],
        "missing_slots": ["string"],
        "time_sensitivity": true,
        "standalone_question": "string"
      }
    },
    {
      "id": "POL",
      "name": "policy_precheck",
      "system": "입력 내용의 정책 위반 여부를 판정하라.",
      "user_template": "message: {{user_message}}\npolicy_rules: {{policy_rules}}",
      "output_schema": {
        "status": "pass|warn|block",
        "reason_codes": ["string"],
        "safe_alternative": "string|null"
      }
    },
    {
      "id": "SUP",
      "name": "supervisor_route_and_rewrite",
      "system": "현재 턴을 answer_direct, search, clarify 중 하나로 라우팅하고, 검색이 필요하면 Azure AI Search용 질의를 재작성하라.",
      "user_template": "parsed_input: {{parsed_input}}\nrecent_turns: {{recent_turns}}\nconversation_summary: {{conversation_summary}}",
      "output_schema": {
        "route": "answer_direct|search|clarify",
        "rewritten_query": "string|null",
        "sub_questions": ["string"],
        "filters": {
          "product": "string|null",
          "channel": "string|null",
          "user_tier": "string|null"
        },
        "clarifying_question": "string|null",
        "use_workflow": false
      }
    },
    {
      "id": "WF",
      "name": "workflow_dispatch_decision",
      "system": "외부 API 조회나 배치성 처리가 필요한지 판정하라. Workflow는 메모리가 없는 서브플로이다.",
      "user_template": "route_plan: {{route_plan}}\nquestion: {{question}}",
      "output_schema": {
        "need_workflow": true,
        "workflow_type": "fact_api|async_job|formatter|none",
        "why": "string"
      }
    },
    {
      "id": "SRCH",
      "name": "azure_ai_search_request",
      "system": "Azure AI Search hybrid tool 호출 파라미터를 생성하라.",
      "user_template": "rewritten_query: {{rewritten_query}}\nfilters: {{filters}}",
      "output_schema": {
        "query": "string",
        "top_k": 8,
        "use_semantic_ranker": true,
        "filters": {
          "product": "string|null",
          "channel": "string|null",
          "user_tier": "string|null"
        }
      }
    },
    {
      "id": "NORM",
      "name": "normalize_search_results",
      "system": "Azure AI Search 결과를 Judge와 Answer Generator가 바로 사용할 수 있도록 정규화하라.",
      "user_template": "search_results: {{search_results}}\nquestion: {{question}}",
      "output_schema": {
        "evidence": [
          {
            "doc_id": "string",
            "title": "string",
            "content": "string",
            "score": 0.0,
            "reranker_score": 0.0,
            "reason": "string"
          }
        ],
        "top_evidence_summary": "string"
      }
    },
    {
      "id": "JUDGE",
      "name": "evidence_sufficiency_judge",
      "system": "현재 검색 근거가 질문에 충분한지 판정하라. 부족하면 누락 정보와 재검색 방향을 제시하라.",
      "user_template": "question: {{question}}\nevidence: {{evidence}}\nretry_count: {{retry_count}}",
      "output_schema": {
        "verdict": "SUFFICIENT|INSUFFICIENT",
        "missing": "string|null",
        "suggested_rewrite": "string|null",
        "retry_allowed": true
      }
    },
    {
      "id": "REWRITE",
      "name": "rewrite_for_retry",
      "system": "Judge가 제안한 누락 정보를 반영해 Azure AI Search용 질의를 다시 작성하라.",
      "user_template": "original_query: {{original_query}}\njudge_result: {{judge_result}}",
      "output_schema": {
        "rewritten_query": "string",
        "filters": {
          "product": "string|null",
          "channel": "string|null",
          "user_tier": "string|null"
        },
        "retry_count": 1
      }
    },
    {
      "id": "ANS",
      "name": "answer_generate",
      "system": "세션 메모리 또는 검색 근거를 사용해 최종 답변을 생성하라. 근거 없는 단정은 금지한다.",
      "user_template": "route: {{route}}\nquestion: {{question}}\nevidence: {{evidence}}\nworkflow_result: {{workflow_result}}\nconversation_summary: {{conversation_summary}}",
      "output_schema": {
        "answer": "string",
        "citations": [
          {"doc_id": "string", "title": "string"}
        ],
        "confidence": 0.0,
        "uncertainty": "string|null"
      }
    },
    {
      "id": "T1",
      "name": "personalize_postprocess",
      "system": "정답 의미를 바꾸지 말고 사용자 선호(톤/길이/형식)만 반영하라.",
      "user_template": "answer: {{answer}}\nprofile: {{profile}}",
      "output_schema": {
        "personalized_answer": "string",
        "applied": {
          "tone": "string",
          "format": "string",
          "length": "string"
        }
      }
    },
    {
      "id": "T2",
      "name": "multiturn_bridge",
      "system": "현재 답변을 이전 대화와 연결하고, 다음 액션 또는 보완 질문을 1~2개 제안하라.",
      "user_template": "recent_turns: {{recent_turns}}\ncurrent_answer: {{personalized_answer}}\nopen_loops: {{open_loops}}",
      "output_schema": {
        "bridged_answer": "string",
        "followups": ["string", "string"]
      }
    },
    {
      "id": "MEM",
      "name": "memory_candidate_and_save_decision",
      "system": "장기 메모리와 세션 메모리를 구분해 저장 후보를 추출하라. 검색 원문과 민감정보는 제외한다.",
      "user_template": "turn_data: {{turn_data}}\nmemory_policy: {{memory_policy}}",
      "output_schema": {
        "session_memory": [{"key": "string", "value": "string"}],
        "long_term_memory": [{"key": "string", "value": "string", "confidence": 0.0}],
        "excluded": [{"key": "string", "reason": "string"}]
      }
    },
    {
      "id": "GY",
      "name": "safe_alternative_response",
      "system": "정책상 차단 시 가능한 범위의 안전한 대체 답변을 제공하라.",
      "user_template": "blocked_reason: {{blocked_reason}}\nuser_intent: {{user_intent}}",
      "output_schema": {
        "safe_response": "string",
        "explanation": "string",
        "allowed_next_steps": ["string"]
      }
    }
  ],
  "pipeline": [
    "B",
    "POL",
    "SUP",
    "WF",
    "SRCH",
    "NORM",
    "JUDGE",
    "REWRITE",
    "ANS",
    "T1",
    "T2",
    "MEM"
  ],
  "demo_context": {
    "user_message": "지난번 설명한 상품 변경 기준일 다시 알려주고, 지금 바로 변경 신청 가능한지도 같이 알려줘.",
    "recent_turns": [
      "어제 변액보험 계약 변경 가능 여부를 물어봤다.",
      "직전 답변에서 적용 기준일은 추가 확인이 필요하다고 안내했다."
    ],
    "conversation_summary": "사용자는 변액보험 계약 변경 규정과 적용일에 관심이 있다.",
    "policy_rules": "민감정보 노출 금지, 근거 없는 단정 금지",
    "profile": {
      "tone": "concise",
      "format": "bullet",
      "language": "ko"
    },
    "memory_policy": {
      "allow_pii": false,
      "min_confidence": 0.7
    }
  }
}
