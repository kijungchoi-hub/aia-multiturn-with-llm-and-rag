            # 분리보관


            ## 1. Domain Description


            분리보관은 특정 조건을 충족하는 계약 정보를 별도로 보관하는 제도로, 분리보관의 적용 시점, 조회 방법, 본인인증 절차, 조회
            소요 시간 등 분리보관된 계약 정보의 관리 및 접근에 관한 전반적인 사항을 다룹니다.


            ## 2. Classification Requirements


            - 분리보관 제도가 적용되는 시점이나 기준에 대한 문의

            - 분리보관된 계약 정보의 조회 가능 여부 또는 조회 불가 상황에 대한 질문

            - 분리보관 계약 조회 시 본인인증 필요 여부에 관한 문의

            - 분리보관 계약 정보조회 소요 시간 또는 처리 절차에 대한 안내 요청

            - 분리보관 이력 확인 및 관련 제도 운영에 관한 질문


            ## 3. Representative Keywords


            분리보관, 분리보관조회, 분리보관 계약, 분리보관 이력, 본인인증, 정보조회, 조회 불가, 계약사항, 조회 소요 시간, 분리보관
            적용


