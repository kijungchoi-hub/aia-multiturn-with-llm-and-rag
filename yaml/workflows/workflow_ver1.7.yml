        code: "import json\ndef main(vdb_body, pm_keyword) -> dict:\n    # Handle\
          \ both string (JSON) and dict inputs\n    # [DSL Constraint] 필요한 필드만 추출하여\
          \ 400,000자 제한 준수\n    if isinstance(vdb_body, str):\n        try:\n    \
          \        body = json.loads(vdb_body)\n        except:\n            body\
          \ = {}\n    else:\n        body = vdb_body if isinstance(vdb_body, dict)\
          \ else {}\n    docs = body.get(\"value\", []) if isinstance(body, dict)\
          \ else []\n\n    # Post-retrieval filtering: prioritize docs matching product\
          \ keyword\n    keyword = (pm_keyword or \"\").strip()\n    matched = []\n\
          \    unmatched = []\n    for d in docs:\n        if isinstance(d, dict):\n\
          \            docnm = d.get(\"docnm_kwd\", \"\") or \"\"\n            if\
          \ keyword and keyword in docnm:\n                matched.append(d)\n   \
          \         else:\n                unmatched.append(d)\n        else:\n  \
          \          unmatched.append(d)\n\n    # Reorder: matched docs first (preserving\
          \ original score order within each group)\n    reordered = matched + unmatched\n\
          \n    texts = []\n    slim_docs = []\n    for d in reordered:\n        if\
          \ isinstance(d, dict):\n            texts.append(d.get(\"content_with_weight\"\
          , \"\"))\n            slim_doc = {\n                \"id\": d.get(\"id\"\
          ),\n                \"content_with_weight\": d.get(\"content_with_weight\"\
          ),\n                \"@search.score\": d.get(\"@search.score\"),\n     \
          \           \"doc_id\": d.get(\"doc_id\"),\n                \"docnm_kwd\"\
          : d.get(\"docnm_kwd\"),\n                \"position_int\": d.get(\"position_int\"\
          ),\n            }\n            slim_docs.append(slim_doc)\n        else:\n\
          \            texts.append(\"\")\n    vdb_str = json.dumps({\"value\": slim_docs},\
          \ ensure_ascii=False)\n    return {\"texts\": json.dumps(texts, ensure_ascii=False),\
          \ \"vdb_body\": vdb_str}"
