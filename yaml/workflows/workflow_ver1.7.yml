            # 보험료납입


            ## 1. Domain Description


            보험료납입 도메인은 보험 계약에 따른 보험료를 납부하는 모든 방법, 절차, 일정 및 관련 서비스를 다룹니다. 자동이체(계좌/카드),
            즉시이체(RTB), 휴대폰소액결제, 가상계좌 등 다양한 납입 수단의 등록·변경·해지, 납입자 지정 및 변경, 납입중지/재개,
            미납 처리 및 실효 방지 서비스, 그리고 보험료 납입과 관련된 시스템 오류 및 절차적 문의를 포함합니다.


            ## 2. Classification Requirements


            - 보험료 납입 **방법/수단**에 관한 질문 (자동이체, 카드결제, 휴대폰소액결제, 즉시이체/RTB, 가상계좌 등)

            - **자동이체 등록, 변경, 해지** 관련 문의 (계좌 승인, 카드 등록, 통신사 연결 등)

            - 보험료 납입 **일정 및 기한**에 관한 질문 (출금일, 승인일, 재출금일, 마감일 연장 등)

            - **납입자 지정 및 변경** 관련 문의 (납입자 범위, 계약자와 납입자 상이 시 처리 등)

            - **납입중지/일시납입중지** 신청, 기간, 조건, 재개에 관한 질문

            - **미납 안내 및 처리** 관련 문의 (미납안내 대상자, 방법, 효력 등)

            - **납입 실패 처리** 및 **실효 방지 서비스** 관련 질문 (실효방지 휴대폰결제, 관리대출금/APL 등)

            - 특정 보험상품의 **납입 방법 가능 여부** 문의 (카드결제, 휴대폰결제 가능 여부 등)

            - **추가납입, 수시추가납입** 조건 및 방법에 관한 질문

            - 납입 관련 **시스템 오류** 및 **화면 코드** 문의

