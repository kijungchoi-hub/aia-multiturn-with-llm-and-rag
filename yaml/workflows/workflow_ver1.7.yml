            # 증명서 안내장


            ## 1. Domain Description


            보험 관련 각종 증명서 및 내역서의 발급, 신청 자격, 발급 조건, 수령 방법, 그리고 증명서 내용에 대한 안내를 다루는 도메인입니다.
            소득공제증명서, 잔액증명서, 보험료 납입증명서, 해지환급금 산출내역서, 연금 지급내역서 등 다양한 보험 관련 서류의 발급 절차와
            조건에 관한 문의를 포함합니다.


            ## 2. Classification Requirements


            - 소득공제증명서, 소득세액공제증명서의 발급 가능 여부 및 조건에 관한 질문

            - 잔액증명서의 발급 기준, 기준일 설정, 금액 차이에 관한 질문

            - 보험료 납입증명서의 발급 형식(국문/영문), 표기 방법에 관한 질문

            - 해지환급금 산출내역서의 신청 가능 상품 및 신청 방법에 관한 질문

            - 연금 지급내역서의 발급 기준 및 신청 자격에 관한 질문

            - 명의변경 사실 확인서 등 기타 확인서의 수령 방법에 관한 질문

            - 증명서 발급 대상자(계약자, 피보험자, 법인, 미성년자 등)에 관한 질문

            - 증명서 발송 방법(팩스, 이메일, AIA+ 앱)과 소요 시간에 관한 질문

            - 특정 계약 상태(해약, 부활, 감액완납, 계약자 변경)에서의 증명서 발급 가능 여부


