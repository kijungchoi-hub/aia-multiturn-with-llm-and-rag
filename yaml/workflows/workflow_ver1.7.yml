          연금정정 (연금계약변경)\": \"연금\",\n        \"(면대면채널) MP이관\": \"설계사\",\n    }\n\n\
          \    # Normalization map for common LLM abbreviations\n    SUBDOMAIN_NORMALIZE\
          \ = {\n        \"납입중지\": \"(의무납입기간 경과 건) 납입중지 신청\",\n        \"납입중지 신청\"\
