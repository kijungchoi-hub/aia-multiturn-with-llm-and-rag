            # 채권압류 질권설정


            ## 1. Domain Description


            보험계약에 대한 압류, 가압류, 질권설정의 개념, 절차, 효력 및 해제에 관한 내용을 다루는 도메인입니다. 법원이나 채권기관의
            압류 설정/해제 절차, 압류 상태에서의 보험금 지급 처리, 계약 변경 제한사항, 복수 압류 시 우선순위 등 채권 관련 법적 제한
            사항 전반을 포함합니다.


            ## 2. Classification Requirements


            - 압류, 가압류, 질권설정의 **개념이나 의미**를 묻는 경우

            - 특정 대상(계약자, 피보험자, 수익자)에 대한 **압류 설정 가능 여부**를 묻는 경우

            - 압류가 설정된 상태에서 **계약 변경(수익자 변경, 명의변경, 해지 등) 가능 여부**를 묻는 경우

            - 압류/가압류 설정 시 **보험금 지급 처리 방법**을 묻는 경우

            - **압류 해제 절차, 시점, 필요 서류**를 묻는 경우

            - 복수의 압류가 있을 때 **우선순위**를 묻는 경우

            - **채권자 정보**(연락처 등) 확인 방법을 묻는 경우

            - 압류금액과 해지환급금의 **차액 처리 방법**을 묻는 경우

            - **추심** 가능 여부 및 절차를 묻는 경우

            - 개인회생, 파산 등 **법적 절차와 압류의 관계**를 묻는 경우


            ## 3. Representative Keywords


            압류, 가압류, 질권설정, 채권자, 추심, 압류 해제, 압류 설정, 법원, 채권기관, 우선순위, 해지환급금, 보험금 지급, 명의변경,
            수익자 변경, 개인회생, 압류금액, 추심계약


