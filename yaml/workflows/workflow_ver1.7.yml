            # 채널 표기 코드


            ## 1. Domain Description


            채널 표기 코드 도메인은 AIA 보험의 다양한 디지털 채널(AIA+ 앱, ARS, 보이는ARS, RTB 등)의 이용 방법, 이용
            가능한 서비스, 기술적 제한 사항, 본인인증 절차, 그리고 통장 출금 시 표기되는 코드의 의미를 다룹니다. 각 채널별 서비스
            범위와 운영 규정에 대한 문의를 포함합니다.


            ## 2. Classification Requirements


            - AIA+ 앱에서 이용 가능한 서비스 종류, 이용 시간, 기능 제한에 관한 질문

            - 보이는ARS 서비스의 이용 방법, 작동 오류, 기술적 문제에 관한 질문

            - ARS 채널에서의 서비스 이용 한도 및 제한 사항에 관한 질문

            - RTB(실시간 출금) 또는 자동이체 시 통장에 표기되는 코드의 의미를 묻는 질문

            - 통장에 표시된 특정 코드(예: AIA05 020)의 해석에 관한 질문

            - 디지털 채널에서의 본인인증 방법(휴대폰 인증, 신분증 인증 등) 및 절차에 관한 질문

            - 본인인증 실패, 잠금, 특별승인 등 보안 제한 사항 및 예외 처리에 관한 질문

            - 특정 전화번호(대표번호, 팩스번호 등)의 용도에 관한 질문

            - 법인 계약자 등 특정 조건에서의 디지털 채널 이용 가능 여부에 관한 질문


            ## 3. Representative Keywords


            AIA+, 보이는ARS, ARS, RTB, 통장 표시, 통장 표기, 출금 코드, 본인인증, 휴대폰인증, 신분증인증, 특별승인,
            로그인, 팝업, 이용 가능, 이용 시간, 잠금해제, 연락처변경, MMS, 팩스번호, 법인, 해약접수, 감액접수, 보험금청구,
            보험계약대출, 제지급


