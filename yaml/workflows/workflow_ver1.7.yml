          \    \"감액완납\": \"(면대면채널)감액 완납\",\n        \"펀드변경\": \"(면대면채널)펀드변경\",\n \
          \       \"중도보험금 접수\": \"중도분할금 접수\",\n        \"위법계약해지\": \"품질보증해지\",\n \
          \       \"보험료납입증명서 발급\": \"소득공제 납입 증명서 발급\",\n        \"적립금이전\": \"(면대면채널)펀드변경\"\
          ,\n    }\n\n    # Parse LLM response - try JSON first, fallback to comma-separated\n\
          \    response = llm_response.strip()\n    domains = []\n    sub_domain =\
