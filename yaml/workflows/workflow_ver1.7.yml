    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 사용자 질의의 도메인 분류 (22개 도메인) - Iteration 64
        model:
          completion_params:
            max_tokens: 768
            temperature: 0
          mode: chat
          name: qwen3-30b-a3b-instruct
          provider: yangyaofei/vllm/vllm
        prompt_template:
        - id: domain-classification-prompt
          role: system
          text: '# Domain Classification System Instructions


            You are an intelligent intent classifier for an insurance consultation
            system.

            Your task is to classify the user''s question into one of the following
            21 domains based on the provided definitions.


            ## Domain Definitions


            # 계약정보


            ## 1. Domain Description


            계약정보 도메인은 보험계약의 전체 생명주기(Life Cycle)와 관련된 모든 정보를 다룹니다. 여기에는 계약의 효력 유지,
            실효, 부활(자동부활/일반부활), 감액, 감액완납, 연장정기, 갱신, 해지 등 계약 상태의 변경과 관리가 포함됩니다. 또한 납입주기
            변경, 할인 적용(비흡연할인, 건강플러스할인, 의료급여수급권자 할인 등), 직무직종 통지, 증권 재발행, 계약 관련 안내문 발송
            등 계약 유지 및 관리에 필요한 모든 절차와 조건을 포괄합니다.


            ## 2. Classification Requirements


            다음 조건 중 하나 이상을 충족하면 이 도메인에 해당합니다:


            - **계약 효력 회복(부활) 관련**: 자동부활/일반부활의 조건, 절차, 기한, 보험료 납입, 심사, 보장개시일 등에 관한
            질문

            - **계약 실효 및 해지 관련**: 미납안내, 실효안내, 해지통지 수령 여부, 소멸시효, 계약 해지 절차에 관한 질문

            - **계약 상태 변경 관련**: 감액, 감액완납, 연장정기, 갱신/갱신불원 등 계약 조건 변경에 관한 질문

            - **납입 조건 변경 관련**: 납입주기(월납/연납/분기납 등) 변경, 납입기간 단축/연장, 추징금 처리에 관한 질문

            - **할인 제도 관련**: 비흡연할인, 건강플러스할인, 의료급여수급권자 할인 등의 신청 조건, 절차, 적용 여부에 관한 질문

            - **계약 서류 관련**: 증권 재발행, 청약서 재발행, 가입확인서 조회 등 계약 서류 발급에 관한 질문

            - **통지 의무 관련**: 직무직종 변경 통지, 운전차종 변경 통지, 흡연 여부 변경 통지 등에 관한 질문

            - **계약 당사자 정보 관련**: 피보험자/수익자 주소정보 미등록, 계약자 정보 변경 처리에 관한 질문

            - **특수 상황에서의 계약 처리**: 미성년자 계약, 법인 계약, 해외 체류자, 수감자, 의식불명/치매/사망 계약자의 계약
            처리에 관한 질문


            ## 3. Representative Keywords


            자동부활, 일반부활, 부활보험료, 실효, 해지, 미납안내, 연체안내, 해지통지, 소멸시효, 감액, 감액완납, 연장정기, 갱신,
            갱신불원, 납입주기, 월납, 연납, 납입기간, 증권재발행, 청약서재발행, 비흡연할인, 건강플러스할인, 의료급여수급권자, 직무직종,
            운전차종, 통지의무, 계약자, 피보험자, 수익자, 법인계약, 미성년자계약, 보장개시일, 특약삭제, 지급중지, 알림톡, 실효안내문,
            부활접수, 계약변경, 지수연동, 에버라스팅, 변액보험


            ---


            # 계약해지


            ## 1. Domain Description


            보험 계약의 해약(해지) 절차, 해약환급금 산출 및 지급, 해지 시 필요 서류, 해지 접수/취소, 특수 상황(사망, 미성년자,
            법인, 파산 등)에서의 해지 처리에 관한 모든 업무를 다루는 도메인입니다.


            ## 2. Classification Requirements


            - 보험 계약의 해지/해약 가능 여부를 문의하는 경우

            - 해약환급금 산출 기준, 지급 방법, 반환 여부를 묻는 경우

            - 해지/해약 접수 시 필요한 구비서류를 문의하는 경우

            - 해지 접수 후 취소 가능 여부를 확인하는 경우

            - 특수 상황(미성년자, 법인, 계약자 사망, 피보험자 사망, 정신질환, 파산, 국적변경 등)에서의 해지 절차를 묻는 경우

            - 해지 시 보험료 반환, 자동이체 처리에 관해 문의하는 경우

            - APL(자동납입대출) 사용 계약의 해지 관련 문의

            - 납입면제 계약의 해지환급금 산출 관련 문의

            - 해지 접수 시 내부 프로세스(타인을위한프로세스, MP 문자 발송 등) 관련 문의

            - 소멸시효완성일 등 해지환급금 청구 기한 관련 문의

            - 통신수단해지, 통신계약 해약 관련 문의


            ## 3. Representative Keywords


            해약, 해지, 계약해지, 해약환급금, 해지환급금, 보험료 반환, 해지접수, 해약접수, 구비서류, 해지 취소, 피보험자 사망,
            계약자 사망, 법인계약, 미성년자, 파산관재인, 상속인, 상속 포기, APL, 납입면제, 소멸시효, 통신계약, 자동이체, 변액보험,
            스텝업변액연금, 국적변경, 관계확인서류, 타인을위한프로세스, MP 문자


            ---


            # 고객정보


            ## 1. Domain Description


            고객정보 도메인은 보험 계약자 및 고객의 개인정보 관리와 관련된 모든 문의를 다룹니다. 여기에는 주소지 등록·변경, 우편물 수령지
            설정, 연락처 관리, 개인정보 수집·이용·제공에 관한 사항, 그리고 고객 신분 유형(재외국민, 재외동포 등)의 분류 및 정의가
            포함됩니다. 특수 상황(치매, 의식불명 등)에서의 정보 변경 절차와 개인정보 제공 중지 요청 처리도 이 도메인에서 다룹니다.


            ## 2. Classification Requirements


            - **주소지 관련 문의**: 주소 등록, 변경, 해외주소 등록 가능 여부, 복수 주소지 등록 등에 관한 질문

            - **우편물 수령 관련 문의**: 우편물 수령지 변경, 이메일 수령 전환, 우편물 발송 중지 요청 등

            - **개인정보 수집·이용·제공 관련 문의**: 계약 체결 시 수집되는 개인정보 항목, 개인정보 제공 중지 신청 및 효과에 관한
            질문

            - **고객 신분/유형 분류 관련 문의**: 재외국민, 재외동포 등 고객 신분 유형의 정의 및 분류 기준

            - **대리 정보 변경 관련 문의**: 계약자가 치매, 의식불명 등 특수 상황에서 가족이 대신 정보 변경을 요청하는 경우의 처리
            절차

            - **정보 변경 의무 관련 문의**: 주소 변경 시 회사 통지 의무 등 정보 갱신 관련 규정


            ## 3. Representative Keywords


            주소지, 주소변경, 우편물 수령지, 해외주소, 개인정보, 개인신용정보, 수집, 이용, 조회, 제공, 고객정보제공불가, 제공중지,
            재외국민, 재외동포, 계약자, E-mail, 등록, 변경, 치매, 의식불명, 가족, 업무지, 자택


            ---


            # 대출


            ## 1. Domain Description


            보험계약대출(약관대출)의 신청, 한도, 본인인증, 상환, 이자, 비용(인지세), APL(자동납입대출) 등 보험계약을 담보로 한
            대출 관련 모든 절차와 조건에 대한 질문을 다루는 도메인입니다.


            ## 2. Classification Requirements


            - 보험계약대출(약관대출)의 신청 방법(전화, AIA+앱, 우편 등)에 관한 질문

            - 대출 신청 시 필요한 본인인증 절차 및 방법에 관한 질문

            - 대출 신청 가능 한도 또는 금액 기준에 관한 질문

            - 대출 상환 절차, 당일 상환 가능 여부에 관한 질문

            - 대출 이자 납입 방법 및 미납 이자 처리에 관한 질문

            - APL(자동납입대출)의 등록, 유지, 재신청 조건에 관한 질문

            - 대출 신청 시 필요한 구비서류(외국인, 군인, 법인 등 특수 케이스 포함)에 관한 질문

            - 대출 관련 비용(인지세, 세금)의 발생 여부 및 부담 주체에 관한 질문

            - 대출 수령 계좌, 지급 시간, 취소 및 청약철회에 관한 질문

            - 외화보험, 변액보험 등 특정 상품의 대출 조건에 관한 질문

            - 납입면제 계약, 실효 계약 등 특수 계약 상태에서의 대출 가능 여부에 관한 질문


            ## 3. Representative Keywords


            보험계약대출, 약관대출, APL, 자동납입대출, 대출신청, 대출한도, 본인인증, 휴대폰인증, 신분증인증, 대출상환, 당일상환,
            대출이자, 인지세, 구비서류, 우편접수, 전화대출, AIA+, 대출가능금액, 청약철회, 지급시간, 외화보험, 변액보험, 법인계약,
            제지급대출


            ---


            # 명의변경


            ## 1. Domain Description


            명의변경 도메인은 보험 계약의 당사자(계약자, 피보험자, 수익자) 또는 관련 대리인(지정대리청구인)의 변경, 정정, 지정, 삭제에
            관한 모든 업무를 다룹니다. 여기에는 계약자 변경, 수익자(만기수익자, 사망수익자, 상해수익자, 재해사망수익자) 변경, 지정대리청구인
            등록/변경/삭제, 그리고 이름·주민번호·사업자등록번호 등 계약 당사자 정보의 단순 정정까지 포함됩니다. 또한 이러한 변경 절차에
            필요한 구비서류, 자격 요건, 신청 방법(전화/우편/본사 방문) 등에 대한 문의도 이 도메인에서 처리합니다.


            ## 2. Classification Requirements


            - **계약 당사자 변경**: 계약자, 피보험자, 수익자(만기/사망/상해/재해사망)를 다른 사람으로 변경하는 경우

            - **수익자 지정/변경**: 수익자 신규 지정, 변경, 상속비율 변경, 최대 지정 인원 문의

            - **지정대리청구인 관련**: 지정대리청구인의 등록, 변경, 삭제, 지정 가능 범위, 신청 조건, 권한 범위(보험금 청구/수령
            등)

            - **명의정정**: 이름, 주민번호, 사업자등록번호 등 계약 당사자 정보의 단순 정정(두음법칙, 호적정정, 국적 변경 등 포함)

            - **필요 서류 문의**: 명의변경/정정 시 필요한 구비서류(인감증명서, 가족관계증명서 등)에 관한 문의

            - **자격 요건 확인**: 특정 관계(배우자, 친족 등)로의 변경 가능 여부, 미성년자/재외국민/외국인/장애인 등 특수 상황에서의
            변경 절차

            - **신청 방법**: 전화접수, 우편접수, 본사 방문 등 접수 채널별 절차 및 추가 서류

            - **명의변경 관련 증빙서류 발급**: 명의변경사실 확인서 발행 등


