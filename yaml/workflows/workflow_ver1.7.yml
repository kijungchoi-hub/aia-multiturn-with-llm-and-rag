          : d.get(\"img_on_page_url\")\n        }, ensure_ascii=False))\n        similarityScore.append(d.get(\"\
          @search.score\", 0))\n    v_result = 1 if valid_result == 1 else int(any(s\
          \ >= th_val for s in similarityScore)) if similarityScore else 0\n    return\
          \ {\n        \"merged_body\": merged_body_str,\n        \"results\": results,\n\
          \        \"sources\": sources,\n        \"v_result\": v_result,\n      \
          \  \"similarityScore\": similarityScore\n    }\n"
