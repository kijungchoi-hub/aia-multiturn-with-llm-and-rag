    - data:
        code: "# ============ 용어 Anchoring (질문 용어 → 문서 용어 매핑) ============\n# 목적:\
          \ 질문에서 사용하는 용어가 문서에서 다른 용어로 사용될 때 Gap 해소\n# 원칙: 실제로 용어 차이가 있는 경우만 매핑 (불필요한\
          \ 확장 금지)\n\nTERM_ANCHORING = {\n    # 해지 관련: 구어체 → 문서 용어\n    \"해약\": [\"\
          해지\"],\n    \n    # 부활 관련: 구어체 → 문서 용어\n    \"살리\": [\"부활\"],\n    \"되살리\"\
          : [\"부활\"],\n    \"다시 살\": [\"부활\"],\n    \n    # 중도인출 관련: 구어체 → 문서 용어\n\
          \    \"빼려\": [\"중도인출\"],\n    \"꺼내\": [\"중도인출\"],\n    \"찾으려\": [\"중도인출\"\
          ],\n    \n    # 수술분류표: 질문 패턴 → 문서 용어\n    \"몇 종\": [\"수술분류표\"],\n    \"\
          몇종\": [\"수술분류표\"],\n    \n    # 소멸시효: 축약형 → 정식 용어\n    \"시효가\": [\"소멸시효\"\
          ],\n    \"시효 지나\": [\"소멸시효\"],\n    \n    # === CS 관련: 질문 용어 → 문서 용어 ===\n\
          \    \n    # 추심/압류: 동의어 양방향\n    \"추심\": [\"압류\"],\n    \n    # 아웃바운드 →\
          \ OB (문서 접두사)\n    \"아웃바운드\": [\"OB\"],\n    \n    # 모집인/mp → MP (문서 용어)\n\
          \    \"모집인\": [\"MP\"],\n    \n    # 자동대출 → APL (문서 약어)\n    \"자동대출\": [\"\
          APL\"],\n    \n    # 직업/차종 변경 → 직무직종 (문서 카테고리)\n    \"직업 변경\": [\"직무직종\"\
          ],\n    \"차종 변경\": [\"직무직종\"],\n    \"반제금\": [\"직무직종\"],\n    \"추징금\": [\"\
          직무직종\"],\n    \n    # 해킹 → 금융사고 (문서 카테고리)\n    \"해킹\": [\"금융사고\"],\n   \
          \ \n    # 호 전환 → 호전환 (띄어쓰기 차이)\n    \"호 전환\": [\"호전환\"],\n    \n    # 위법계약\
          \ → 위법계약해지 (문서 용어 확장)\n    \"위법계약\": [\"위법계약해지\"],\n    \n    # 자료 열람 →\
          \ 자료열람요구 (문서 용어)\n    \"자료 열람\": [\"자료열람요구\"],\n    \"자료열람\": [\"자료열람요구\"\
          ],\n    \n    # 비과세 한도 → 비과세한도 (띄어쓰기)\n    \"비과세 한도\": [\"비과세한도\"],\n  \
          \  \n    # 지로납 → 지로납입 (축약형)\n    \"지로납\": [\"지로납입\"],\n    \n    # 약관 발행/재발행\
          \ → 증권 약관 재발행\n    \"약관 발행\": [\"증권 약관 재발행\"],\n    \"약관 재발행\": [\"증권 약관재발행\"\
          ],\n    \n    # 증권 재발행\n    \"증권 재발행\": [\"증권 약관재발행\"],\n}\n\n\ndef main(query:\
          \ str, keywords: str) -> dict:\n    \"\"\"\n    용어 Anchoring: 질문 용어와 문서\
          \ 용어 간 Gap 해소\n    \n    Args:\n        query: 원본 질문\n        keywords:\
          \ LLM이 추출한 키워드\n    \n    Returns:\n        expanded_keywords: 문서 용어가 추가된\
          \ 키워드 (VDB 검색에 사용)\n    \"\"\"\n    additions = []\n    keywords_lower =\
          \ keywords.lower()\n    \n    for user_term, doc_terms in TERM_ANCHORING.items():\n\
          \        if user_term in query:\n            for term in doc_terms:\n  \
          \              if term not in keywords_lower and term not in additions:\n\
          \                    additions.append(term)\n    \n    expanded = keywords\n\
          \    if additions:\n        expanded = keywords + \" \" + \" \".join(additions)\n\
          \    \n    return {\n        \"expanded_keywords\": expanded\n    }\n"
        code_language: python3
