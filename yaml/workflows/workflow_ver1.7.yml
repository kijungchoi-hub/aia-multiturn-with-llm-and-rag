            # 연금


            ## 1. Domain Description


            보험계약의 연금전환 절차, 전환 조건, 연금 수령 방식, 연금개시 후 처리사항 등 연금 관련 보험 서비스 전반에 대한 문의를
            다루는 도메인입니다. 연금전환 가능 조건, 특약 처리, 세제 적용, 수령 시점 및 방법 등을 포함합니다.


            ## 2. Classification Requirements


            - 보험계약의 **연금전환 가능 조건**에 관한 질문 (미상환 대출, 채권압류, 사망수익자 지정 등)

            - **연금전환 신청 절차 및 방법**에 관한 질문 (전화접수, 접수 안내문구 등)

            - 연금전환 시 **특약의 처리 방식**에 관한 질문 (보장유지특약, 갱신특약 등)

            - **연금전환 후 변경 또는 취소** 가능 여부에 관한 질문

            - **연금 수령 개시 시점, 주기, 방식**에 관한 질문 (일시금 수령, 지급일자 등)

            - **연금개시 후 피보험자 사망** 시 수익자 및 청구 절차에 관한 질문

            - 연금 관련 **세제 적용** 질문 (비과세 기간, 과세 시점, 적격/비적격 연금 구분)

            - **연금 계약변경** 조건에 관한 질문 (연금개시연령 변경, 지급주기 변경 등)

            - 연금전환 시 적용되는 **경험생명표, 공시이율** 등 기준에 관한 질문

            - **연금신청권자** 및 수령 자격에 관한 질문


