    - data:
        code: "import json\nfrom collections import defaultdict\n\ndef main(sources_array,\
          \ domains_json, predicted_questions, message_text, answer_reasoning, img_on_page_url,\
          \ img_in_chunk_urls, cs_docnm_kwd, pc_docnm_kwd, sub_domain) -> dict:\n\
          \    \"\"\"\n    전체 응답 JSON을 생성\n    [v3.825] reasoning을 답변 생성 노드의 structured_output.reasoning에서\
          \ 캡처\n    \"\"\"\n    # sources: JSON 문자열 배열 -> JSON 객체 배열\n    parsed_sources\
          \ = []\n    for s in sources_array:\n        if isinstance(s, str):\n  \
          \          try:\n                parsed_sources.append(json.loads(s))\n\
          \            except:\n                parsed_sources.append({\"raw\": s})\n\
          \        else:\n            parsed_sources.append(s)\n\n    # [v3.802] Step\
          \ 1: SAMWM 중복 제거 (chunkId 기준, 높은 score 유지)\n    non_wm = [s for s in parsed_sources\
          \ if s.get(\"docType\") != \"SAMWM\"]\n    wm_sources = [s for s in parsed_sources\
          \ if s.get(\"docType\") == \"SAMWM\"]\n    unique_wm = {}\n    for s in\
          \ wm_sources:\n        cid = s.get(\"chunkId\")\n        if cid:\n     \
          \       if cid not in unique_wm or (s.get(\"chunkScore\", 0) or 0) > (unique_wm[cid].get(\"\
          chunkScore\", 0) or 0):\n                unique_wm[cid] = s\n    deduped_sources\
          \ = non_wm + list(unique_wm.values())\n\n    # [v3.802] Step 2: docType별\
          \ Score 정규화 (min-max)\n    by_doctype = defaultdict(list)\n    for s in\
          \ deduped_sources:\n        by_doctype[s.get(\"docType\", \"Unknown\")].append(s)\n\
          \n    for dt, items in by_doctype.items():\n        scores = [s.get(\"chunkScore\"\
          , 0) or 0 for s in items]\n        min_s, max_s = min(scores), max(scores)\n\
          \        range_s = max_s - min_s if max_s > min_s else 1\n        for s\
          \ in items:\n            orig = s.get(\"chunkScore\", 0) or 0\n        \
          \    s[\"normalizedScore\"] = (orig - min_s) / range_s if range_s > 0 else\
          \ 0\n\n    # [v3.802] Step 3: normalizedScore로 정렬\n    formatted_sources\
          \ = sorted(deduped_sources, key=lambda x: x.get(\"normalizedScore\", 0),\
          \ reverse=True)\n\n    # important_cs 제거 (API 응답에 불필요)\n    for src in formatted_sources:\n\
          \        src.pop(\"important_cs\", None)\n\n    # domains: JSON 문자열 -> 배열로\
          \ 파싱\n    try:\n        domains_array = json.loads(domains_json) if domains_json\
          \ else []\n    except:\n        domains_array = []\n\n    # 전체 응답 객체 생성\n\
          \    response = {\n        \"type\": \"ANSWER\",\n        \"sources\": formatted_sources,\n\
          \        \"domains\": domains_array,\n        \"predictedQuestions\": predicted_questions\
          \ if predicted_questions else [],\n        \"message\": message_text if\
          \ message_text else \"\",\n        \"reasoning\": answer_reasoning if answer_reasoning\
          \ else \"\"\n    }\n    if img_on_page_url:\n        response[\"img_on_page_url\"\
          ] = img_on_page_url\n    if cs_docnm_kwd:\n        response[\"cs_docnm_kwd\"\
          ] = cs_docnm_kwd\n    if img_in_chunk_urls:\n        response[\"img_in_chunk_urls\"\
          ] = img_in_chunk_urls\n    if pc_docnm_kwd:\n        response[\"pc_docnm_kwd\"\
          ] = pc_docnm_kwd\n    if sub_domain:\n        response[\"checkpoint\"] =\
          \ sub_domain\n\n    return {\n        \"full_response\": json.dumps(response,\
          \ ensure_ascii=False)\n    }\n"
        code_language: python3
