            # 민원


            ## 1. Domain Description


            민원 도메인은 일반적인 보험 업무 프로세스를 벗어나는 **특수 요청, 분쟁성 사안, 이의 제기** 및 **특별 처리가 필요한
            계약 관련 문의**를 다룹니다. 표준 절차로 처리할 수 없는 예외적 상황이나 고객의 권리 구제를 위한 특수 제도(위법계약해지,
            품질보증해지 등)에 대한 질의가 이 도메인에 해당합니다.


            ## 2. Classification Requirements


            - **특수 해지 제도** 관련 문의 (위법계약해지, 품질보증해지 등 일반 해지와 구분되는 특별 해지 절차)

            - **제3자 요청 처리**: 계약자가 아닌 사람의 민원접수 요청

            - **권한 관련 특수 상황**: 당사 소속 모집인인 계약자의 민원접수 가능 여부

            - **분쟁성 요청**: 규정/기한 경과 후에도 특정 처리를 요구하는 경우 (예: 자동부활 기한 경과 건)

            - **개인정보 사고 대응**: 개인정보 유출 확인 요청 및 사고 대응

            - **특수 발급 요청**: 소멸계약 증권 재발행 등 일반 발급 절차를 벗어나는 요청

            - **특수 제도의 조건/기한/방법/서류** 관련 세부 문의


            ## 3. Representative Keywords


            민원접수, 제3자, 위법계약해지, 품질보증해지, 개인정보 유출, 소멸계약, 증권 재발행, 자동부활 거부, 분쟁, 이의 제기,
            특수 요청, 해지 가능 기간, 해지 가능 조건, 신청 방법, 필요 서류, 접수 제한, 처리 소요 시간, 모집인 계약자


