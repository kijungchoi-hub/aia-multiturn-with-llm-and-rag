    - data:
        code: "import json\ndef main(rerank_response, metadata, adj_use_bm: str =\
          \ \"false\", adj_use_tc: str = \"false\", all_sources: list = [], top_k:\
          \ int = 5) -> dict:\n    \"\"\"\n    Rerank 결과에서 상위 N개 추출하고 원본 source 구조\
          \ 유지\n    rerankScore와 rerankRank만 추가\n    Type-aware: BM/TC가 활성화된 경우 해당\
          \ docType 최소 3개 보장\n    + Sources Filter: all_sources에서 top-K chunkId만 유지,\
          \ SAMPC/SAMCS 보존\n    \"\"\"\n    if isinstance(rerank_response, str):\n\
          \        try:\n            rerank_data = json.loads(rerank_response)\n \
          \       except:\n            rerank_data = {}\n    else:\n        rerank_data\
          \ = rerank_response if isinstance(rerank_response, dict) else {}\n\n   \
          \ if isinstance(metadata, str):\n        try:\n            sources_list\
          \ = json.loads(metadata)\n        except:\n            sources_list = []\n\
          \    else:\n        sources_list = metadata if isinstance(metadata, list)\
          \ else []\n\n    results = rerank_data.get(\"results\", [])\n\n    # Determine\
          \ which doc types need minimum guarantees\n    min_guarantee_types = {}\n\
          \    if adj_use_bm == \"true\":\n        min_guarantee_types[\"SAMBM\"]\
          \ = 3\n    if adj_use_tc == \"true\":\n        min_guarantee_types[\"SAMTC\"\
          ] = 3\n\n    if not min_guarantee_types:\n        # No type guarantees needed,\
          \ use simple top-k\n        top_results = results[:top_k]\n    else:\n \
          \       # Type-aware selection\n        # Step 1: classify results by docType\n\
          \        type_results = {}\n        for item in results:\n            idx\
          \ = item.get(\"index\", 0)\n            if idx < len(sources_list) and isinstance(sources_list[idx],\
          \ dict):\n                dt = sources_list[idx].get(\"docType\", \"UNKNOWN\"\
          )\n            else:\n                dt = \"UNKNOWN\"\n            if dt\
          \ not in type_results:\n                type_results[dt] = []\n        \
          \    type_results[dt].append(item)\n\n        # Step 2: reserve slots for\
          \ guaranteed types\n        reserved = []\n        reserved_indices = set()\n\
          \        for dt, min_count in min_guarantee_types.items():\n           \
          \ available = type_results.get(dt, [])\n            for item in available[:min_count]:\n\
          \                idx = item.get(\"index\", 0)\n                if idx not\
          \ in reserved_indices:\n                    reserved.append(item)\n    \
          \                reserved_indices.add(idx)\n\n        # Step 3: fill remaining\
          \ slots with best global rerank results\n        remaining_slots = top_k\
          \ - len(reserved)\n        fill = []\n        for item in results:\n   \
          \         if len(fill) >= remaining_slots:\n                break\n    \
          \        idx = item.get(\"index\", 0)\n            if idx not in reserved_indices:\n\
          \                fill.append(item)\n\n        # Step 4: combine and sort\
          \ by relevance_score\n        top_results = reserved + fill\n        top_results.sort(key=lambda\
          \ x: x.get(\"relevance_score\", 0), reverse=True)\n\n    reranked_chunks\
          \ = []\n    reranked_sources = []\n\n    for rank, item in enumerate(top_results,\
          \ 1):\n        idx = item.get(\"index\", 0)\n        score = item.get(\"\
          relevance_score\", 0)\n        if idx < len(sources_list):\n           \
          \ src = sources_list[idx].copy() if isinstance(sources_list[idx], dict)\
          \ else {}\n            src[\"rerankScore\"] = score\n            src[\"\
          rerankRank\"] = rank\n\n            doc_type = src.get(\"docType\", \"UNKNOWN\"\
          )\n            doc_name = src.get(\"docName\", \"\")\n            contents\
          \ = src.get(\"contents\", \"\")\n            reranked_chunks.append(f\"\
          [Chunk {rank}] [{doc_type}] {doc_name}\\n{contents}\")\n            reranked_sources.append(json.dumps(src,\
          \ ensure_ascii=False))\n\n    reranked_context = \"\\n\\n---\\n\\n\".join(reranked_chunks)\n\
          \n    # ── Part 2: Sources Filter ──\n    topk_ids = set()\n    for item\
          \ in reranked_sources:\n        obj = json.loads(item) if isinstance(item,\
          \ str) else item\n        cid = obj.get(\"chunkId\")\n        if cid:\n\
          \            topk_ids.add(cid)\n\n    filtered = []\n    removed = 0\n \
          \   for s in all_sources:\n        obj = json.loads(s) if isinstance(s,\
          \ str) else s\n        doc_type = obj.get(\"docType\", \"\")\n        cid\
          \ = obj.get(\"chunkId\", \"\")\n        if doc_type in (\"SAMPC\", \"SAMCS\"\
          ) or cid in topk_ids:\n            filtered.append(json.dumps(obj, ensure_ascii=False)\
          \ if isinstance(obj, dict) else s)\n        else:\n            removed +=\
          \ 1\n\n    return {\n        \"reranked_context\": reranked_context,\n \
          \       \"reranked_sources\": reranked_sources,\n        \"reranked_count\"\
          : len(reranked_chunks),\n        \"filtered_sources\": filtered,\n     \
          \   \"filtered_count\": len(filtered),\n        \"removed_count\": removed,\n\
          \    }\n"
        code_language: python3
