          \ 응답 가공\"\"\"\n    # --- Phase 1: Rerank 점수 적용 및 정렬 ---\n    TOP_K = 10\n\
          \    if isinstance(vdb_body, str):\n        try:\n            vdb = json.loads(vdb_body)\n\
          \        except:\n            vdb = {}\n    else:\n        vdb = vdb_body\
          \ if isinstance(vdb_body, dict) else {}\n    docs = vdb.get(\"value\", [])\
          \ if isinstance(vdb, dict) else []\n    if isinstance(rerank_body, str):\n\
          \        try:\n            rerank_scores = json.loads(rerank_body)\n   \
          \     except:\n            rerank_scores = []\n    else:\n        rerank_scores\
          \ = rerank_body.get(\"results\", []) if isinstance(rerank_body, dict) else\
          \ (rerank_body if isinstance(rerank_body, list) else [])\n    for item in\
          \ rerank_scores:\n        if isinstance(item, dict):\n            idx =\
          \ item.get(\"index\")\n            score = item.get(\"relevance_score\"\
          , 0)\n            if idx is not None and 0 <= idx < len(docs) and isinstance(docs[idx],\
          \ dict):\n                docs[idx][\"@search.score\"] = score\n    docs.sort(key=lambda\
          \ x: x.get(\"@search.score\", -1) if isinstance(x, dict) else -1, reverse=True)\n\
          \n    # Post-retrieval product filtering: boost matching docs to top\n \
          \   if product_code and product_code.strip():\n        pc = product_code.strip()\n\
          \        matched = [d for d in docs if isinstance(d, dict) and d.get(\"\
          docnm_kwd\", \"\") == pc]\n        unmatched = [d for d in docs if isinstance(d,\
          \ dict) and d.get(\"docnm_kwd\", \"\") != pc]\n        docs = matched +\
          \ unmatched\n\n    docs = docs[:TOP_K]\n\n    merged_body_str = json.dumps({\"\
          value\": docs}, ensure_ascii=False)\n\n    # --- Phase 2: 응답 가공 ---\n  \
          \  data = docs\n    results = []\n    sources = []\n    similarityScore\
          \ = []\n    for d in data:\n        if not isinstance(d, dict):\n      \
          \      continue\n        results.append(d.get(\"content_with_weight\", \"\
          \"))\n        sources.append(json.dumps({\n            \"chunkId\": d.get(\"\
          id\"),\n            \"chunkScore\": d.get(\"@search.score\", 0),\n     \
          \       \"docType\": \"SAMPM\",\n            \"docId\": d.get(\"doc_id\"\
          ),\n            \"docName\": d.get(\"docnm_kwd\"),\n            \"position\"\
