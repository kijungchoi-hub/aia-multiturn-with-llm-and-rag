            # 제지급


            ## 1. Domain Description


            제지급은 보험 계약상 발생하는 각종 급부금(만기보험금, 중도보험금, 배당금, 연금, 환급금 등)의 신청, 수령, 지급 절차 및
            관련 서비스를 다루는 도메인입니다. 청약철회로 인한 보험료 반환, 실손보험료 환급, 휴면보험금 수령, 송금계좌 등록/관리, 자동송금
            설정 등 보험금을 받기 위한 모든 절차와 요건을 포함합니다.


            ## 2. Classification Requirements


            - **급부금 신청 및 수령 방법**: 만기보험금, 중도보험금, 배당금, 연금 등의 신청 채널(ARS, 전화, AIA+, 우편
            등) 및 절차에 관한 질문

            - **급부금 수령 자격 및 권한**: 청구권자, 신청권자, 수익자 자격 요건(미성년자, 성년후견인, 상속인, 외국인, 법인
            등)에 관한 질문

            - **급부금 지급 조건 및 한도**: 신청 가능 금액, 최대 한도, 횟수 제한, 본인인증 기준 금액 등에 관한 질문

            - **송금계좌 등록 및 관리**: 송금계좌 등록 방법, 자동등록 조건, 외화계좌 등록, 계좌 개수 제한 등에 관한 질문

            - **자동송금 서비스**: 자동송금 신청 방법, 시점, 갱신, 대상 상품 등에 관한 질문

            - **청약철회 및 보험료 반환**: 청약철회 신청, 철회 기간, 보험료 반환 시점, 반환 방법(현금/카드취소) 등에 관한 질문

            - **환급금 관련**: 실손보험료 환급 신청, 조건, 소요기간, 환급 방법 등에 관한 질문

            - **휴면보험금**: 휴면보험금 수령 절차, 수령계좌, 금액 차이 등에 관한 질문

            - **비거주자/외국인 관련**: 비거주자 판정, 원천징수, 필요 서류 등 급부금 지급 시 특수 요건에 관한 질문

            - **급부금 지급 시 세금/이자**: 지연이자, 원천징수, 세금 공제 등에 관한 질문

            - **특수 상황에서의 급부금 처리**: 압류, 지급중지, 실효예정, 대출 존재 시 급부금 수령 가능 여부 등에 관한 질문


