            # 보험금 보장


            ## 1. Domain Description


            보험금 보장 도메인은 보험사고 발생 시 보험금 청구 절차, 필요 서류, 청구 한도, 그리고 특정 질병·상해·수술에 대한 보장
            여부 및 보장 범위를 다루는 영역입니다. 보험약관상 보장 대상, 수술 종별 분류, 질병분류코드, 수익자 자격 및 보험금 청구권
            관련 문의가 포함됩니다.


            ## 2. Classification Requirements


            - **보험금 청구 절차 관련**: 보험금 청구 방법, 청구 시 필요한 구비서류, 청구 한도, 청구권 소멸시효 등을 문의하는
            경우

            - **보장 여부 확인**: 특정 수술, 시술, 질병, 상해가 보험에서 보장되는지 여부를 문의하는 경우

            - **보장 범위 확인**: 특정 보험상품에서 보장하는 질병 종류(암 종류, 특정질환 등), 수술 종별 분류(몇 종 수술인지)를
            문의하는 경우

            - **수익자 관련**: 보험금 수익자 자격, 미성년자·후견인·법정상속인 등 수익자별 청구 서류 및 자격을 문의하는 경우

            - **질병분류코드 관련**: 한국표준질병분류코드(C50, D37 등)의 의미, 해당 질병의 보장 여부를 문의하는 경우

            - **약관 용어 해석**: 약관상 수술 종류, 의료 용어(흡인, 천자, 뇌졸중, 경계성종양 등)의 정의를 문의하는 경우

            - **보험금 세금·상속 관련**: 보험금 수령 시 세금 처리, 상속 포기 시 청구 가능 여부 등을 문의하는 경우

            - **보장 조건 확인**: 해외 사고 보장, 부담보 조건, 질병분류 개정에 따른 보장 변동 등을 문의하는 경우


