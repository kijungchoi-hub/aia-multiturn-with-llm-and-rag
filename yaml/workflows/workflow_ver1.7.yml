        classes:
        - id: '1'
          name: 보험 업무 질문
        - id: '2'
          name: 일반 대화
        desc: 사용자 질문을 보험 업무 질문과 일반 대화로 분류합니다.
        instruction: '사용자의 질문을 아래 기준으로 분류하세요. 판단이 애매하면 보험 업무 질문으로 분류하세요.


          ## 보험 업무 질문

          - 보험 상품, 계약, 보장, 청구, 해지, 납입, 약관, 특약 등 보험 관련 질문

          - 변액보험 관련: 펀드, 펀드변경, 투입비율, 적립금, 적립금이전, 자동재분배, 목표수익률, 펀드운영, 수익률 등

          - 업무 절차, 서류, 규정, 매뉴얼에 대한 질문

          - 금융, 세무, 법률 관련 질문 (보험과 연관된 경우)

          - 구체적인 정보를 요청하는 질문

          - 보험 용어나 업무 절차에 대해 묻는 짧은 질문도 포함


          ## 일반 대화

          - 인사 (안녕하세요, 반갑습니다, 감사합니다 등)

          - 잡담 (날씨, 기분, 자기소개 요청 등)

          - 시스템 테스트 질문 (테스트, 123 등)

          - 보험과 무관한 일반 상식 질문

          '
