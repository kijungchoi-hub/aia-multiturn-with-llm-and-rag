            # 설계사


            ## 1. Domain Description


            설계사(MP) 관련 업무를 다루는 도메인으로, 설계사 지정, 변경, 이관 등의 절차와 조건에 관한 문의를 포함한다. 보험 계약에
            대한 담당 설계사의 배정, 관리, 변경 프로세스 전반을 아우르며, 특수 상황(미성년자 계약, 실효 상태, 타 채널 등)에서의
            설계사 관련 정책을 다룬다.


            ## 2. Classification Requirements


            - 담당 MP(설계사) 지정의 필수 여부 또는 지정 절차에 관한 문의

            - 설계사 변경 가능 조건 및 절차에 관한 질문

            - 계약의 설계사 이관 가능 여부, 조건, 필요 서류에 관한 문의

            - 특정 상태(실효, 미성년자 계약 등)에서의 설계사 지정/변경 가능 여부

            - 설계사 본인 계약에 대한 이관 정책 문의

            - 채널 간 설계사 이관 조건에 관한 질문

            - MP 소속 변경 또는 배정 관련 문의


            ## 3. Representative Keywords


            MP, 설계사, 담당, 지정, 이관, 변경, 이관동의서, 활동MP, 계약 건, 소속, 채널, 실효상태, 미성년자계약, 본인 계약,
            단체영업, 제출 서류, 조건


