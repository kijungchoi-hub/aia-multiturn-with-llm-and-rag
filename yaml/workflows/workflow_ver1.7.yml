          \ = parts[-1].strip() if len(parts) > 1 else keyword\n    # Remove quotes\
          \ if wrapped\n    if keyword.startswith('\"') and keyword.endswith('\"'):\n\
          \        keyword = keyword[1:-1]\n    # Try to extract from JSON if present\n\
          \    if \"{\" in keyword:\n        import json\n        try:\n         \
          \   data = json.loads(keyword[keyword.index(\"{\"):keyword.rindex(\"}\"\
