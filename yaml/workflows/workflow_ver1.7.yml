            # 신계약 미결


            ## 1. Domain Description


            신계약 미결 도메인은 보험 신규 계약 체결 과정에서 발생하는 미결 상태, 건강 재고지 절차, 부담보 설정/해제, 계약 반송 처리
            등 계약 성립 이전 단계의 모든 처리 사항을 다룬다. 주로 계약 심사 중 발생하는 보완 요청, 서류 재제출, 상태 확인 및 조건부
            승인 관련 업무가 포함된다.


            ## 2. Classification Requirements


            - **계약상태 미결 관련**: 계약상태 코드(예: 10), 미결 상태, 보완 상태(M2 등)에 대한 문의

            - **건강 재고지 절차**: 재고지 접수 가능 기간, 재고지 방법(자필서명, 우편 등), 재고지 가능 조건, 재고지 횟수 제한
            등

            - **부담보 설정/해제**: 청약 시 부담보 설정 조건, 완치 후 부담보 해제 가능 여부 및 절차

            - **채널별 처리 문의**: 통신채널, 대면채널, B채널 등 가입 채널별 신계약 미결 처리 방법

            - **계약 반송 처리**: 보험 계약 반송 안내문 관련 문의

            - **실효 상태에서의 재고지**: 실효 상태 계약의 재고지 가능 여부

            - **증권번호 기준 재고지**: 동일 증권번호에 대한 반복 재고지 관련 문의


            ## 3. Representative Keywords


            계약상태, 미결, 재고지, 건강 재고지, 부담보, 부담보 설정, 부담보 해제, 반송, 반송 안내문, 통신채널, 대면채널, B채널,
            자필서명, M2 보완, 증권번호, 실효상태, 청약, 접수 가능기간, 보완


