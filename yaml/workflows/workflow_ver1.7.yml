          \ in PAYMENT_DOMAIN_ADD_PATTERNS)\n\n    if is_claim_context and \"제지급\"\
          \ in domains and \"보험금 보장\" in domains:\n        if not is_payment_context:\n\
          \            # 급부금 키워드가 없는 경우에만 \"제지급\" 도메인 제외\n            domains = [d\
