            # 해피콜


            ## 1. Domain Description


            해피콜은 신계약 체결 후 고객에게 전화를 통해 계약 내용을 확인하는 절차에 관한 영역이다. 해피콜의 진행 방법, 대상 기준,
            제외 대상, 미완료 시 처리 절차, 그리고 외국인·고령자·청각장애인 등 특수 상황에서의 해피콜 진행 방법을 다룬다.


            ## 2. Classification Requirements


            - 해피콜의 정의, 목적, 진행 절차에 관한 질문

            - 해피콜 대상 또는 제외 대상 기준에 관한 질문

            - 해피콜 미완료 또는 거부 시 처리 방법에 관한 질문

            - 해피콜 전화 시도 횟수 등 구체적인 진행 규정에 관한 질문

            - 특수 상황(외국인, 고령자, 청각장애인 등) 계약자에 대한 해피콜 방법에 관한 질문

            - 특정 채널(통신채널, GA채널 등) 상품의 해피콜 관련 문의

            - 해피콜 관련 지원 제도(고령자 조력제도 등)에 관한 질문

            - 심사연동과 해피콜 대상 상품 확인에 관한 질문


            ## 3. Representative Keywords


            해피콜, 미완료, 제외대상, 거부, 외국인, 고령자, 청각장애인, 조력제도, 전화 시도, 통신채널, GA채널, 심사연동, 신계약,
            계약자, 처리, 대상, 방법


