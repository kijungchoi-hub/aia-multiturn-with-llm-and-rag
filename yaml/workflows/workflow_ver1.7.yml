            # 법 제도


            ## 1. Domain Description


            보험 계약 및 금융 거래와 관련된 법률, 세제 혜택, 규제 준수 제도를 다루는 도메인입니다. 저축성보험의 비과세 요건, 성년후견제도,
            상속법, 자금세탁방지(AML), 국제조세정보교환(FATCA/CRS) 등 보험업무 수행 시 필수적으로 준수해야 하는 법적 요건과
            제도적 규정을 포함합니다.


            ## 2. Classification Requirements


            - 저축성보험의 비과세 요건, 한도, 유지기간 등 세제 혜택 관련 질문

            - 성년후견, 한정후견, 특정후견, 임의후견 등 후견제도 관련 질문

            - 후견인의 권한, 위임, 필요 서류 등 후견제도 절차 관련 질문

            - 민법상 미성년자 기준, 법정상속인, 상속순위 등 민법 관련 질문

            - AML(자금세탁방지), CDD(고객확인의무), EDD(강화된 고객확인) 관련 질문

            - FATCA, CRS 등 국제조세정보교환 제도 관련 질문

            - 실명확인증표, 관계확인서류, 구비서류 등 법적 서류 요건 관련 질문

            - 법인계약 관련 제도적 규정 및 서류 간소화 기준 관련 질문

            - 준법감시, 컴플라이언스, 블랙리스트 확인 등 규제 준수 절차 관련 질문

            - SSN, ITIN, EIN 등 세법 관련 식별번호 및 용어 정의 질문


