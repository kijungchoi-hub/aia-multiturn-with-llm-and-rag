            AIA Vitality 건강증진 프로그램에 관한 도메인으로, 멤버십 등급 체계(브론즈/실버/골드/플래티넘), 포인트 적립 기준,
            프로그램 가입 절차, 유료/무료 회비 납입 방법, 멤버십 유지 및 철회 조건 등 바이탈리티 프로그램의 운영 전반을 다룬다.


            ## 2. Classification Requirements


            - 바이탈리티(Vitality) 등급 종류, 등급별 포인트 기준, 등급 달성 조건에 대한 문의

            - 바이탈리티 프로그램 가입 방법, 가입 채널(AIA+ 앱 등)에 대한 문의

            - 바이탈리티 유료/무료 멤버십 회비 금액, 납입 방법, 납입자 범위에 대한 문의

            - 바이탈리티 회비 미납 시 효력 상실, 자동이체, 직접납부 등 납입 관련 절차 문의

            - 바이탈리티 멤버십 철회, 해지, 탈퇴 조건에 대한 문의

            - 바이탈리티 버전(1.0, 1.1 등) 관련 차이점이나 전환에 대한 문의

            - 바이탈리티 프로그램 혜택, 리워드, 포인트 적립에 대한 문의


            ## 3. Representative Keywords


            바이탈리티, 바탈, Vitality, 브론즈, 실버, 골드, 플래티넘, 등급, 포인트, 유료회비, 무료회비, 회비납입, 납입방법,
