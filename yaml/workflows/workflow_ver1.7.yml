            이전, 자동재배분, 목표수익률 설정 등 변액보험의 투자 펀드 운용 전반에 대한 절차, 조건, 규정을 다룹니다.


            ## 2. Classification Requirements


            - 펀드변경(펀드 교체) 신청 횟수, 시점, 절차, 마감시간, 필요서류에 관한 질문

            - 펀드투입비율 변경 및 그 적용 방식에 관한 질문

            - 적립금이전 신청, 취소, 이전 시점에 관한 질문

            - 펀드 자동재배분 신청, 취소, 기준, 횟수에 관한 질문

