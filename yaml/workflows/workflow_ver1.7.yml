            # 상품


            ## 1. Domain Description


            상품은 보험 상품의 가입 한도, 무료로 제공되는 보험 상품, 상품별 고유 특징 및 차별화 요소 등 보험 상품의 가입 조건과 특성에
            관한 정보를 다룹니다. 주로 상품 가입 시 제한 사항, 무료 제공 상품의 혜택 등을 포함합니다.


            ## 2. Classification Requirements


            - 보험 상품의 가입 한도 또는 가입 가능 금액에 대한 문의

            - 무료로 제공되는 보험 상품의 종류나 가입 방법에 관한 질문

            - 특정 상품의 고유 특징이나 다른 상품과의 차별점에 대한 문의

            - 상품별 가입 제한 조건(나이, 건강상태 등)에 대한 질문

            - 무료보험의 보장 내용이나 혜택에 대한 안내 요청



            ## 3. Representative Keywords


            가입한도, 무료보험, 상품특징, 가입제한, 무료가입, 가입조건, 가입금액, 한도제한, 상품차별점, 무료제공, 보험혜택



