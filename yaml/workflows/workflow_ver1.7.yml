            # 헬스케어서비스


            ## 1. Domain Description


            헬스케어서비스 도메인은 보험상품에 부가되어 제공되는 건강관리 및 의료지원 서비스 전반을 다룬다. 여기에는 헬스케어 서비스의 가입
            조건, 서비스 종류 및 내용, 이용 방법, 연간 지원 횟수, 이용 대상(본인/가족), 서비스 용어 정의 등이 포함된다.


            ## 2. Classification Requirements


            - 특정 보험상품의 **헬스케어 서비스 가입 조건**을 문의하는 경우

            - 헬스케어 서비스의 **종류 및 세부 내용**을 묻는 경우

            - 헬스케어 서비스의 **연간 지원 횟수** 또는 이용 한도를 묻는 경우

            - 헬스케어 서비스의 **이용 방법** 또는 신청 절차를 문의하는 경우

            - 헬스케어 서비스의 **이용 대상**(본인, 가족 등) 범위를 묻는 경우

            - 헬스케어 서비스에서 사용하는 **용어의 정의**나 조건을 문의하는 경우

            - 특정 헬스케어 서비스(기본/시니어/암특화 등) **유형별 제공 여부**를 확인하는 경우

            - 헬스케어 서비스와 **외부 업체 연계** 여부를 묻는 경우


            ## 3. Representative Keywords


            AIA 헬스케어 서비스, 헬스케어 가입 조건, 전문의료진 실시간 건강상담, 차량에스코트 서비스, 시니어일반헬스케어, 간호사 병원
            방문동행, 암특화헬스케어서비스, 암건강정보안내, 전화심리상담, 케어스테이 서비스, 해외 의료지원서비스, 상조서비스, 헬스케어
            기본서비스, 연간 지원횟수, 이용 방법, 큰병 정의


